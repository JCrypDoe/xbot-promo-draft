<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VioletNight WHO | Earth3</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0A0A0A;color:#B0B0B0;font:400 18px/1.6 Inter,system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:1.2rem 1rem 2.4rem}
.hero{position:relative;padding:1rem 1rem 1rem 7.2rem;border:1px solid #1F1F1F;background:radial-gradient(circle at 50% 8%,rgba(57,255,20,.16),transparent 40%),#111}
.home-logo{position:absolute;left:1rem;top:.8rem;display:block}
.home-logo img{display:block;width:88px;height:auto;filter:drop-shadow(0 0 8px rgba(191,0,255,.28))}
h1{margin:.8rem 0 .4rem;color:#fff;text-shadow:0 0 14px rgba(191,0,255,.72),0 0 28px rgba(191,0,255,.45);font:700 clamp(1.95rem,7vw,3rem)/1.08 "Space Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase}
.sub{margin:0;color:#39FF14;font:700 .9rem/1 "Space Mono",ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase}
.links{display:flex;flex-wrap:wrap;gap:.65rem;margin-top:.95rem}
.btn{display:inline-block;padding:.6rem .9rem;text-decoration:none;font:700 .76rem/1 "Space Mono",ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;border:1px solid #1F1F1F;background:#1A1A1A;color:#B0B0B0}
.btn.home{background:#39FF14;color:#000}.btn:hover{box-shadow:0 0 10px rgba(57,255,20,.3)}
.panel{margin-top:1rem;border:1px solid #1F1F1F;background:#111;padding:.8rem}
.panel img{width:100%;height:auto;display:block;border:1px solid #1F1F1F;background:#0A0A0A}
.panel p{margin:.55rem 0 0}
@media (max-width:760px){.hero{padding:6.7rem 1rem 1rem}.home-logo img{width:82px}}
</style>
</head>
<body>
<main>
  <section class="hero">
    <a class="home-logo" href="earth3-8-tools.html" aria-label="Back to Earth3 tools home">
      <img src="earth3-logo.png" alt="Earth3 logo home button" onerror="this.style.display='none'">
    </a>
    <h1>VioletNight WHO</h1>
    <p class="sub">PlayerPower identity visual</p>
    <div class="links">
      <a class="btn home" href="earth3-8-tools.html">Back to Earth3 Tools</a>
      <a class="btn" href="who-details.html">Back to WHO Details</a>
    </div>
  </section>

  <section class="panel">
    <img src="assets/Who-VioletNight-Violet-v1.png" alt="Who VioletNight Violet visual">
    <p>Reference visual for the WHO narrative: identity proof with privacy, player-owned context, and selective disclosure design language.</p>
  </section>
</main>
</body>
</html>
